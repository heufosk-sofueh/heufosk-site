<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>heufosk 受信箱</title>
<style>
:root{--ink:#1a1a1a;--line:#e6e6e2;--sage:#a9c5c0;--bg:#f6f6f4}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600}
header .sp{flex:1}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-family:inherit;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.wrap{max-width:820px;margin:0 auto;padding:18px}
.gate{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.gate h2{margin:0 0 6px;font-size:17px}
.gate p{color:#666;font-size:13px;margin:0 0 16px;line-height:1.7}
.gate input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:15px;font-family:inherit;margin-bottom:12px}
.gate .btn{width:100%;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm{font-weight:600;font-size:15px}
.card .em{color:#666;font-size:13px}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;margin-left:auto}
.b-new{background:#eef6f4;color:#2a6b60;border:1px solid #cfe6e0}
.b-open{background:#f3f3f0;color:#666;border:1px solid var(--line)}
.b-blocked{background:#faeaea;color:#a33;border:1px solid #eccccc}
.sum{background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:13.5px;line-height:1.7;color:#333}
.meta{color:#999;font-size:12px;margin-top:6px}
.toggle{color:#2a6b60;font-size:12.5px;cursor:pointer;margin-top:8px;display:inline-block}
.thread{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.thread.show{display:block}
.msg{margin:7px 0;font-size:13px;line-height:1.6}
.msg .r{font-size:11px;color:#999;display:block;margin-bottom:2px}
.msg.user .b{background:#eef2f1;display:inline-block;padding:7px 10px;border-radius:9px}
.msg.assistant .b{background:#fff;border:1px solid var(--line);display:inline-block;padding:7px 10px;border-radius:9px}
.empty{color:#999;text-align:center;padding:44px 0;font-size:14px}
.err{color:#a33;font-size:13px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h2>heufosk 受信箱</h2>
  <p>お問い合わせの一覧を見るには、合い言葉を入力してください。</p>
  <input id="pw" type="password" placeholder="合い言葉" autocomplete="current-password">
  <button class="btn" id="go">開く</button>
  <div class="err" id="err"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>heufosk お問い合わせ受信箱</h1>
    <span class="sp"></span>
    <button class="btn ghost" id="reload">更新</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab on" data-t="leads" id="tabL">問い合わせ</div>
      <div class="tab" data-t="blocked" id="tabB">ブロック済み</div>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var BACKEND = "https://iafahdtihdmlwmcjzdbt.supabase.co/functions/v1/chat-admin";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhZmFoZHRpaGRtbHdtY2p6ZGJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MDEzMjUsImV4cCI6MjA5NDQ3NzMyNX0.DvIYk6QBMulXY_2505vVrOIJB-fp_K9Bu1-trq_K1hk";
  var DATA=null, TAB="leads", PW="";
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function fmt(t){if(!t)return "";var d=new Date(t);return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
  async function load(pw){
    var r=await fetch(BACKEND,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify({token:pw})});
    return await r.json();
  }
  $("go").onclick=async function(){
    var pw=$("pw").value.trim(); if(!pw)return;
    $("err").textContent="確認中…";
    try{
      var d=await load(pw);
      if(!d||!d.ok){$("err").textContent="合い言葉が違います。";return;}
      PW=pw; DATA=d; $("gate").style.display="none"; $("app").style.display="block"; render();
    }catch(e){ $("err").textContent="接続に失敗しました。時間をおいて再度お試しください。"; }
  };
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click();});
  $("reload").onclick=async function(){var d=await load(PW);if(d&&d.ok){DATA=d;render();}};
  $("tabL").onclick=function(){TAB="leads";$("tabL").classList.add("on");$("tabB").classList.remove("on");render();};
  $("tabB").onclick=function(){TAB="blocked";$("tabB").classList.add("on");$("tabL").classList.remove("on");render();};
  function thread(msgs){var h="";(msgs||[]).forEach(function(m){h+='<div class="msg '+(m.role==="user"?"user":"assistant")+'"><span class="r">'+(m.role==="user"?"お客様":"AI")+'</span><span class="b">'+esc(m.content)+'</span></div>';});return h;}
  function render(){
    var list=$("list"), rows=(TAB==="leads"?DATA.leads:DATA.blocked)||[];
    if(!rows.length){list.innerHTML='<div class="empty">'+(TAB==="leads"?"まだお問い合わせはありません。":"ブロックされたものはありません。")+'</div>';return;}
    var html="";
    rows.forEach(function(l,i){
      var badge = TAB==="blocked" ? '<span class="badge b-blocked">ブロック</span>' : (l.needs_human?'<span class="badge b-new">要対応</span>':'<span class="badge b-open">対応不要</span>');
      html+='<div class="card"><div class="top"><span class="nm">'+esc(l.name||"(名前なし)")+'</span><span class="em">'+esc(l.email||"")+'</span>'+badge+'</div>';
      if(TAB==="leads" && l.summary) html+='<div class="sum">'+esc(l.summary)+'</div>';
      if(TAB==="blocked" && l.spam_reason) html+='<div class="sum">理由: '+esc(l.spam_reason)+'</div>';
      html+='<div class="meta">'+fmt(l.updated_at||l.created_at)+'・'+((l.messages||[]).length)+'件のメッセージ</div>';
      html+='<span class="toggle" data-i="'+i+'">会話を見る ▾</span><div class="thread" id="th'+i+'">'+thread(l.messages)+'</div></div>';
    });
    list.innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll(".toggle"),function(t){t.onclick=function(){var el=$("th"+t.getAttribute("data-i"));el.classList.toggle("show");t.textContent=el.classList.contains("show")?"会話を閉じる ▴":"会話を見る ▾";};});
  }
})();
</script>
</body>
</html>
